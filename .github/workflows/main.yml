How we work
This is not a directory and it is not a marketplace. Inquiries are handled one at a time. We confirm what you want, match a companion, and keep the arrangement between the people involved.
No public profiles. No comments. No social accounts tied to your name.
	•	Privacy first. Details are not stored longer than needed to arrange the booking.
	•	Adults only. Everyone involved is 21 or older.
	•	Clear terms. Time, setting, and expectations are agreed before anything is scheduled.
What can be arranged
Evenings
Dinner, theatre, a gallery opening, or a quiet night in. A companion who can hold a conversation and leave when the evening is over.
Travel
A plus-one for a weekend or a longer trip. Travel costs and schedule are set in writing before departure.
Events
Weddings, work functions, and family occasions where arriving with someone composed is simpler than arriving alone.
Process
	1	01 Inquire Send a short note with city, preferred dates, and the kind of company you want. No need for a life story. 
	2	02 Match If we can help, we reply with a companion description and the fee. You accept or decline. Nothing is booked until you say so. 
	3	03 Meet A brief public meet can be arranged first if you prefer. After that, the booking runs as agreed. 
